<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minha Aplicação</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <!-- Cabeçalho -->
        <div class="text-center">
            <div class="mx-auto h-12 w-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Bem-vindo de volta</h2>
            <p class="mt-2 text-sm text-gray-600">Por favor, acesse sua conta para continuar</p>
        </div>

        <!-- Formulário -->
        <form class="mt-8 space-y-6" action="#" method="POST" onsubmit="handleLogin(event)">
            <div class="rounded-md shadow-sm space-y-4">
                <!-- Campo E-mail -->
                <div>
                    <label for="email-address" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input id="email-address" name="email" type="email" autocomplete="email" required 
                            class="appearance-none rounded-xl relative block w-full px-3 py-3 pl-10 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" 
                            placeholder="seu@email.com">
                    </div>
                </div>

                <!-- Campo Senha -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input id="password" name="password" type="password" autocomplete="current-password" required 
                            class="appearance-none rounded-xl relative block w-full px-3 py-3 pl-10 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" 
                            placeholder="••••••••">
                    </div>
                </div>
            </div>

            <!-- Opções adicionais -->
            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-gray-900">Lembrar de mim</label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Esqueceu sua senha?</a>
                </div>
            </div>

            <!-- Botão de Ação -->
            <div>
                <button type="submit" 
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-200 transition-all">
                    Entrar
                </button>
            </div>
        </form>

        <!-- Rodapé do Card -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">
                Não tem uma conta? 
                <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- Script de exemplo para interatividade -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email-address').value;
            alert(`Login simulado com sucesso para: ${email}`);
        }
    </script>
</body>
</html>
